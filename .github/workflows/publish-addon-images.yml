name: Publish Home Assistant add-on images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, for example 1.2.10. Defaults to the tag name without v."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-addon-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.addon_arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_arch: amd64
            platform: linux/amd64
          - addon_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: homeassistant-addon/ups2mqtt
          file: homeassistant-addon/ups2mqtt/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          tags: ghcr.io/aburow/${{ matrix.addon_arch }}-addon-ups2mqtt:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/aburow/ups2mqtt-db
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.hass.name=ups2mqtt
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.arch=${{ matrix.addon_arch }}
            io.hass.type=addon
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.addon_arch }}
