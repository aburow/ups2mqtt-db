[project]
name = "ups2mqtt"
version = "1.2.15"
description = "ups2mqtt bridge runtime"
requires-python = ">=3.13"
dependencies = [
  "aiohttp==3.14.5",
  "Jinja2==3.1.6",
  "paho-mqtt==2.1.0",
  "pymodbus==3.16.1",
  "pysnmp==7.1.30",
  "PyYAML==6.0.3",
]

[dependency-groups]
lint = [
  "grain-lint==0.3.1",
  "pre-commit>=4.7.0,<5",
  "pytest>=9.1.1,<10",
  "ruff==0.17.1",
  "semgrep==1.181.0",
  "sqlfluff==4.4.0",
  "yamllint==1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown -- Cooldown removed for v1.2.15 by maintainer approval; restore or reassess next release.
[tool.uv]
package = false
override-dependencies = ["mcp==1.30.0"]
