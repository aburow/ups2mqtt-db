[project]
name = "ups2mqtt"
version = "1.2.13"
description = "ups2mqtt bridge runtime"
requires-python = ">=3.13"
dependencies = [
  "aiohttp==3.14.0",
  "Jinja2==3.1.6",
  "paho-mqtt==2.1.0",
  "pymodbus==3.13.0",
  "pysnmp==7.1.27",
  "PyYAML==6.0.3",
]

[dependency-groups]
lint = [
  "grain-lint==0.3.1",
  "pre-commit>=4.6.0,<5",
  "pytest>=9,<10",
  "ruff==0.15.13",
  "semgrep==1.163.0",
  "sqlfluff==4.2.1",
  "yamllint==1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
